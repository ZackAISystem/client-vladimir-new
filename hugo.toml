baseURL = "https://vladimirmaksimov.com/"
title = "Vladimir Maksimov AI System"
languageCode = "en"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

[permalinks]
  projects = "/projects/:slug/"
  areas = "/areas/:slug/"
  developers = "/developers/:slug/"
  pages = "/:slug/"

[languages]

  [languages.en]
    languageName = "English"
    weight = 1
    disabled = false
    contentDir = "content"

  [languages.ru]
    languageName = "Русский"
    weight = 2
    disabled = false
    contentDir = "content"

  [languages.ar]
    languageName = "العربية"
    weight = 3
    disabled = false
    languageDirection = "rtl"
    contentDir = "content"

  [languages.hi]
    languageName = "हिन्दी"
    weight = 4
    disabled = false
    contentDir = "content"

[params]
  brand = "Vladimir Maksimov"
  system_name = "Vladimir Maksimov AI System"
  assistant_name = "Sicemco AI"
  role = "CEO at Sicemco Real Estate"
  market = "UAE real estate investment"
  location = "Dubai, UAE"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true